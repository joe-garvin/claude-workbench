<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Working drawings, Gemini · Joe Garvin</title>
<style>
  :root { --ground:#171614; --tile:#0f0e0d; --text:#ebe4d4; --dim:#8f887b; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--ground); color:var(--text); }
  body { font:16px/1.45 "Iowan Old Style", "Palatino Linotype", Georgia, serif; -webkit-font-smoothing:antialiased; }
  main { max-width:1440px; margin:0 auto; padding:72px 40px 120px; }
  header { margin-bottom:56px; }
  header h1 { font-size:34px; font-weight:400; letter-spacing:.01em; margin:0 0 10px; }
  header p { margin:0; color:var(--dim); font-size:15px; }
  header p.name { color:var(--text); font-size:17px; margin-bottom:2px; }
  nav.pages { display:flex; gap:22px; margin-top:22px; font-size:15px; }
  nav.pages a { color:var(--dim); text-decoration:none; padding-bottom:3px; border-bottom:1px solid transparent; }
  nav.pages a:hover { color:var(--text); }
  nav.pages a.on { color:var(--text); border-bottom-color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:44px 28px; }
  .tile { display:block; color:inherit; text-decoration:none; }
  .tile .frame { aspect-ratio:4/3; background:var(--tile); overflow:hidden; }
  .tile img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .5s ease, opacity .3s; }
  .tile:hover img, .tile:focus-visible img { transform:scale(1.025); }
  .tile:focus-visible { outline:1px solid var(--dim); outline-offset:6px; }
  .tile .cap { display:flex; justify-content:space-between; gap:12px; margin-top:12px; font-size:15px; }
  .tile .cap span:last-child { color:var(--dim); font-size:13px; padding-top:2px; }
  @media (max-width:640px) { main { padding:44px 18px 80px; } header { margin-bottom:36px; } header h1 { font-size:28px; } .grid { grid-template-columns:1fr 1fr; gap:28px 12px; } .tile .cap { font-size:14px; margin-top:8px; } .tile .cap span:last-child { display:none; } }

  /* viewer */
  #viewer { position:fixed; inset:0; background:#0d0c0b; display:none; z-index:10; user-select:none; -webkit-user-select:none; }
  #viewer.open { display:block; }
  #stage { position:absolute; inset:56px 72px 64px; overflow:hidden; touch-action:none; }
  #stage img { position:absolute; left:0; top:0; transform-origin:0 0; cursor:zoom-in; will-change:transform; max-width:none; }
  #viewer.zoomed #stage { inset:0; }
  #viewer.zoomed #stage img { cursor:grab; }
  #viewer.zoomed.dragging #stage img { cursor:grabbing; }
  #viewer.zoomed .chrome { opacity:0; pointer-events:none; }
  .chrome { transition:opacity .2s; }
  #bar { position:absolute; left:28px; right:28px; bottom:20px; display:flex; justify-content:space-between; align-items:baseline; font-size:15px; }
  #bar .count { color:var(--dim); font-size:13px; }
  .btn { position:absolute; background:none; border:0; color:var(--dim); font:inherit; cursor:pointer; padding:14px; line-height:1; }
  .btn:hover, .btn:focus-visible { color:var(--text); outline:none; }
  .btn svg { display:block; width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.3; }
  #close { top:10px; right:14px; }
  #prev { left:10px; top:50%; transform:translateY(-50%); }
  #next { right:10px; top:50%; transform:translateY(-50%); }
  #unzoom { top:10px; right:14px; display:none; }
  #viewer.zoomed #unzoom { display:block; }
  #hint { position:absolute; top:22px; left:28px; color:var(--dim); font-size:13px; }
  #loading { position:absolute; right:28px; top:22px; color:var(--dim); font-size:13px; display:none; }
  #viewer.loadingfull #loading { display:block; }
  @media (max-width:640px) { #stage { inset:52px 0 60px; } #prev, #next { display:none; } #hint { display:none; } #bar { left:16px; right:16px; } }
</style>
</head>
<body>
<main>
<header>
  <h1>Working drawings</h1>
  <p class="name">Joe Garvin</p>
  <p>Made with Nano Banana 2 in Gemini, from prompts written with Claude</p>
  <nav class="pages"><a href="index.html">Code</a><a class="on" href="gemini.html">Gemini</a></nav>
</header>
<div class="grid" id="grid"></div>
</main>

<div id="viewer" aria-modal="true" role="dialog" aria-label="Image viewer">
  <div id="stage"><img id="pic" alt="" draggable="false"></div>
  <div class="chrome">
    <div id="hint">Click to zoom</div>
    <button class="btn" id="close" aria-label="Back to all works"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <button class="btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    <div id="bar"><span id="title"></span><span class="count" id="count"></span></div>
  </div>
  <div id="loading">Loading full resolution…</div>
  <button class="btn" id="unzoom" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M7.5 10.5h6M15.5 15.5L20 20"/></svg></button>
</div>

<script>
const WORKS = [
  { id:'g-039', title:"Blocks", images:[['g-039',1408,768]] },
  { id:'g-055', title:"Two pale shapes", images:[['g-055',1408,768]] },
  { id:'g-058', title:"Lacquer", images:[['g-058',928,1152]] },
  { id:'g-060', title:"Wax", images:[['g-060',768,1376]] },
  { id:'g-064', title:"Corner forms", images:[['g-064',768,1376]] },
  { id:'g-073', title:"Quiet", images:[['g-073',1408,768]] },
  { id:'g-074', title:"Mostly dark", images:[['g-074',1408,768]] },
  { id:'g-079', title:"Seed heads", images:[['g-079',1408,768]] },
  { id:'g-086', title:"Left out in the rain", images:[['g-086',768,1376]] },
  { id:'g-091', title:"Rope", images:[['g-091',720,1456]] },
  { id:'g-097', title:"Mending", images:[['g-097',1024,1024]] },
  { id:'g-101', title:"One line", images:[['g-101',1024,1024]] },
  { id:'g-103', title:"Ochre and black", images:[['g-103',1408,768]] },
  { id:'g-108', title:"Tracing paper and wire", images:[['g-108',1024,1024]] },
  { id:'g-115', title:"Bleach", images:[['g-115',1408,768]] },
  { id:'g-136', title:"Stitched line", images:[['g-136',1408,768]] },
  { id:'g-145', title:"Spiral", images:[['g-145',1024,1024]] },
  { id:'g-146', title:"Cobalt pull", images:[['g-146',1376,768]] },
  { id:'g-147', title:"Gold line", images:[['g-147',768,1376]] },
];
// flat sequence: every image of every work, in order
const SEQ = [];
WORKS.forEach(w => w.images.forEach((im, i) => SEQ.push({ work:w, n:i, key:im[0], w:im[1], h:im[2] })));

const grid = document.getElementById('grid');
WORKS.forEach(w => {
  const a = document.createElement('a');
  a.className = 'tile'; a.href = '#' + w.id;
  a.innerHTML = `<div class="frame"><img src="thumb/${w.images[0][0]}.jpg" alt="${w.title}" loading="lazy" width="900" height="675"></div>
    <div class="cap"><span>${w.title}</span><span>${w.images.length > 1 ? w.images.length + ' variations' : ''}</span></div>`;
  grid.appendChild(a);
});

const viewer = document.getElementById('viewer'), stage = document.getElementById('stage'), pic = document.getElementById('pic');
const titleEl = document.getElementById('title'), countEl = document.getElementById('count');
let cur = -1, base = { w:0, h:0, x:0, y:0 }, s = 1, tx = 0, ty = 0, fullLoaded = false, lastScroll = 0;

function indexFromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return -1;
  const [id, n] = h.split('/');
  const k = SEQ.findIndex(e => e.work.id === id && e.n === (n ? (+n - 1) : 0));
  return k;
}
function route() {
  const k = indexFromHash();
  if (k < 0) { close(false); return; }
  if (!viewer.classList.contains('open')) { lastScroll = scrollY; viewer.classList.add('open'); document.body.style.overflow = 'hidden'; }
  show(k);
}
function hashFor(k) { const e = SEQ[k]; return '#' + e.work.id + (e.n ? '/' + (e.n + 1) : ''); }
function go(k) { k = (k + SEQ.length) % SEQ.length; history.replaceState(null, '', hashFor(k)); show(k); }
function close(push = true) {
  if (!viewer.classList.contains('open')) return;
  viewer.classList.remove('open', 'zoomed', 'loadingfull'); document.body.style.overflow = '';
  if (push) history.replaceState(null, '', location.pathname + location.search);
  const t = cur >= 0 ? grid.querySelector(`a[href="#${SEQ[cur].work.id}"]`) : null;
  scrollTo(0, lastScroll); cur = -1; if (t) t.focus({ preventScroll:true });
}
function show(k) {
  cur = k; const e = SEQ[k];
  viewer.classList.remove('zoomed', 'loadingfull'); fullLoaded = false;
  pic.src = `img/${e.key}.jpg`; pic.alt = e.work.title;
  titleEl.textContent = e.work.title;
  countEl.textContent = e.work.images.length > 1 ? `${e.n + 1} of ${e.work.images.length}` : '';
  layout(); fit();
  [k + 1, k - 1].forEach(j => { const p = SEQ[(j + SEQ.length) % SEQ.length]; new Image().src = `img/${p.key}.jpg`; });
}
function layout() {
  const e = SEQ[cur]; if (!e) return;
  const r = stage.getBoundingClientRect();
  const sc = Math.min(r.width / e.w, r.height / e.h);
  base.w = e.w * sc; base.h = e.h * sc; base.x = (r.width - base.w) / 2; base.y = (r.height - base.h) / 2;
  pic.style.width = base.w + 'px'; pic.style.height = base.h + 'px';
}
function apply() { pic.style.transform = `translate(${base.x + tx}px, ${base.y + ty}px) scale(${s})`; }
function fit() { s = 1; tx = 0; ty = 0; apply(); }
function maxScale() { const e = SEQ[cur]; return Math.max(1, (e.w / base.w) / (window.devicePixelRatio || 1) * 2); }
function nativeScale() { const e = SEQ[cur]; return Math.max(1.5, (e.w / base.w) / (window.devicePixelRatio || 1)); }
function clamp() {
  const r = stage.getBoundingClientRect(), w = base.w * s, h = base.h * s;
  // keep the image covering the stage where it is larger, centred where smaller
  const minX = Math.min(r.width - w, (r.width - w) / 2) - base.x, maxX = Math.max(0, (r.width - w) / 2) - base.x;
  const minY = Math.min(r.height - h, (r.height - h) / 2) - base.y, maxY = Math.max(0, (r.height - h) / 2) - base.y;
  tx = Math.min(maxX, Math.max(minX, tx)); ty = Math.min(maxY, Math.max(minY, ty));
}
function loadFull() {
  return; // Gemini images are shown at their native size
  if (fullLoaded) return; fullLoaded = true;
  const e = SEQ[cur], k = cur, im = new Image();
  viewer.classList.add('loadingfull');
  im.onload = () => { if (cur === k) { pic.src = im.src; viewer.classList.remove('loadingfull'); } };
  im.onerror = () => viewer.classList.remove('loadingfull');
  im.src = `full/${e.key}.jpg`;
}
// zoom around a point given in stage coords, to scale ns
function zoomAt(px, py, ns) {
  const wasFit = s <= 1.001;
  if (wasFit && ns > 1) { // the stage grows to full screen when zoomed; keep the point under the cursor
    const r0 = stage.getBoundingClientRect();
    viewer.classList.add('zoomed'); const old = { ...base };
    layout(); const r1 = stage.getBoundingClientRect();
    // fraction of the image under the point at fit scale, then the point in the new stage's coords
    const ix = (px - old.x) / old.w, iy = (py - old.y) / old.h;
    px += r0.left - r1.left; py += r0.top - r1.top;
    s = ns * old.w / base.w;
    tx = px - base.x - ix * base.w * s; ty = py - base.y - iy * base.h * s;
    clamp(); apply(); loadFull(); return;
  }
  ns = Math.min(maxScale(), Math.max(1, ns));
  const ix = (px - base.x - tx) / s, iy = (py - base.y - ty) / s;
  s = ns; tx = px - base.x - ix * s; ty = py - base.y - iy * s;
  if (s <= 1.001) { unzoom(); return; }
  clamp(); apply(); loadFull();
}
function unzoom() { viewer.classList.remove('zoomed'); layout(); fit(); }

// pointer handling: tap toggles zoom, drag pans (zoomed) or swipes (fit), two fingers pinch
const pts = new Map(); let start = null, moved = false, pinch = null;
stage.addEventListener('pointerdown', ev => {
  stage.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  if (pts.size === 1) { start = { x:ev.clientX, y:ev.clientY, tx, ty, t:Date.now() }; moved = false; }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), s }; moved = true; }
});
stage.addEventListener('pointermove', ev => {
  if (!pts.has(ev.pointerId)) return;
  pts.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  const r = stage.getBoundingClientRect();
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, pinch.s * d / pinch.d);
    return;
  }
  if (!start) return;
  const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
  if (viewer.classList.contains('zoomed')) { viewer.classList.add('dragging'); tx = start.tx + dx; ty = start.ty + dy; clamp(); apply(); }
});
function endPointer(ev) {
  if (!pts.has(ev.pointerId)) return;
  pts.delete(ev.pointerId); viewer.classList.remove('dragging');
  if (pts.size > 0) { start = null; return; }
  pinch = null;
  if (!start) return;
  const dx = ev.clientX - start.x, dy = ev.clientY - start.y, zoomed = viewer.classList.contains('zoomed');
  if (!moved && ev.type === 'pointerup') {
    const r = stage.getBoundingClientRect();
    if (zoomed) unzoom(); else zoomAt(ev.clientX - r.left, ev.clientY - r.top, nativeScale());
  } else if (!zoomed && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    go(cur + (dx < 0 ? 1 : -1));
  }
  start = null;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', ev => {
  ev.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, s * Math.exp(-ev.deltaY * 0.0022));
}, { passive:false });

document.getElementById('close').onclick = () => close();
document.getElementById('unzoom').onclick = () => unzoom();
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.addEventListener('keydown', ev => {
  if (!viewer.classList.contains('open')) return;
  if (ev.key === 'Escape') { viewer.classList.contains('zoomed') ? unzoom() : close(); }
  else if (ev.key === 'ArrowRight') go(cur + 1);
  else if (ev.key === 'ArrowLeft') go(cur - 1);
});
addEventListener('resize', () => { if (cur >= 0) { const z = viewer.classList.contains('zoomed'); layout(); if (z) { clamp(); apply(); } else fit(); } });
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
